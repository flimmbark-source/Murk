<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MURK - Victorian Orphanage Defense</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <!-- Header -->
    <div id="header">
      <div id="header-left">
        <div id="turn-info">T<span id="turn-number">1</span></div>
        <div id="phase-info"><span id="phase-name">RITUAL</span></div>
        <div id="mana-info">
          <span id="mana-current">1</span>/<span id="mana-max">1</span>
        </div>
      </div>

      <div id="ritual-track">
        <div class="ritual-bar player-bar">
          <span class="ritual-label">PLR</span>
          <div class="ritual-bar-container">
            <div id="player-ritual-fill" class="ritual-fill"></div>
          </div>
          <span id="player-ritual-text" class="ritual-value">0</span>
        </div>
        <div class="ritual-bar cpu-bar">
          <span class="ritual-label">CPU</span>
          <div class="ritual-bar-container">
            <div id="cpu-ritual-fill" class="ritual-fill"></div>
          </div>
          <span id="cpu-ritual-text" class="ritual-value">0</span>
        </div>
      </div>
    </div>

    <!-- Main Game Area -->
    <div id="game-area">
      <!-- Board Canvas -->
      <canvas id="board-canvas" width="900" height="500"></canvas>
    </div>

    <!-- Player Hand -->
    <div id="hand-area">
      <div id="hand-title">YOUR HAND</div>
      <div id="hand-cards"></div>
    </div>

    <!-- Lane Order Controls -->
    <div id="lane-order-controls">
      <div class="lane-order-title">ALL LANES</div>
      <div class="lane-order-buttons">
        <button id="advance-all-btn" class="lane-order-btn">ADVANCE</button>
        <button id="hold-all-btn" class="lane-order-btn">HOLD</button>
      </div>
      <div id="lane-order-status">NONE</div>
    </div>

    <!-- Action Buttons -->
    <div id="action-buttons">
      <button id="advance-phase-btn" class="action-btn">ADVANCE PHASE</button>
      <button id="end-turn-btn" class="action-btn">END TURN</button>
    </div>

    <!-- Event Log -->
    <div id="event-log">
      <div class="log-title">EVENT LOG</div>
      <div id="log-content"></div>
    </div>

    <!-- Card Details Pop-up -->
    <div id="card-details-popup" class="hidden">
      <div class="card-details-content">
        <div class="card-details-header">
          <div class="card-details-cost" id="popup-cost"></div>
          <div class="card-details-name" id="popup-name"></div>
        </div>
        <div class="card-details-type" id="popup-type"></div>
        <div class="card-details-stats">
          <div class="card-stat stat-attack">⚔ <span id="popup-attack"></span></div>
          <div class="card-stat stat-health">❤ <span id="popup-health"></span></div>
        </div>
        <div class="card-details-description" id="popup-description"></div>
        <div class="card-details-position" id="popup-position"></div>
      </div>
    </div>

    <!-- Modal for game over -->
    <div id="game-over-modal" class="modal hidden">
      <div class="modal-content">
        <h2 id="winner-text"></h2>
        <button id="restart-btn" class="action-btn">NEW GAME</button>
      </div>
    </div>
  </div>

  <!-- Auto-reload script for development -->
  <script>
    // Simple auto-reload on server restart
    let lastCheck = Date.now();
    setInterval(() => {
      fetch('/').then(() => {
        // If server responds and enough time has passed, reload
        const now = Date.now();
        if (now - lastCheck > 3000) {
          console.log('Server restarted, reloading page...');
          location.reload();
        }
        lastCheck = now;
      }).catch(() => {
        // Server is down, will reconnect when back up
      });
    }, 1000);
  </script>

  <script type="module" src="./dist/client/main.js"></script>
</body>
</html>
